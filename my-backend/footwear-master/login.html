<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      outline: none;
    }

    input:focus {
      border-color: #6e8efb;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #6e8efb;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #5a7cf0;
    }

    #result {
      margin-top: 10px;
      font-size: 14px;
      color: red;
    }
  </style>
</head>
<body>

<!-- LOGIN FORM -->
<div id="loginForm">
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- REGISTER FORM -->
<div id="registerForm" style="display:none;">
  <input type="email" id="registerEmail" placeholder="Email">
  <input type="password" id="registerPassword" placeholder="Password">
  <input type="password" id="confirmPassword" placeholder="Confirm Password">
  <button onclick="register()">Register</button>
</div>

<script>
function showLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
}

function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
}

// LOGIN (แก้ id ให้ตรง)
function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;

  fetch('/api/login', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.token) {
      localStorage.setItem('token', data.token);
      document.getElementById('result').style.color = "green";
      document.getElementById('result').innerText = "Login success!";
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    } else {
      document.getElementById('result').innerText = "Login failed";
    }
  })
  .catch(() => {
    document.getElementById('result').innerText = "Server error";
  });
}

// REGISTER
function register() {
  const email = document.getElementById('registerEmail').value;
  const password = document.getElementById('registerPassword').value;
  const confirm = document.getElementById('confirmPassword').value;

  if (password !== confirm) {
    document.getElementById('result').innerText = "Passwords do not match";
    return;
  }

  fetch('/api/register', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.message === "User created") {
      document.getElementById('result').style.color = "green";
      document.getElementById('result').innerText = "Register success! Please login.";
      showLogin();
    } else {
      document.getElementById('result').innerText = data.message || "Register failed";
    }
  })
  .catch(() => {
    document.getElementById('result').innerText = "Server error";
  });
}
</script>

</body>
</html>
