<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #6e8efb;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    #result {
      margin-top: 10px;
      font-size: 14px;
      color: red;
    }
  </style>
</head>

<body>

<div class="login-box">

  <!-- LOGIN -->
  <div id="loginForm">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- REGISTER -->
  <div id="registerForm" style="display:none;">
    <h2>Register</h2>
    <input type="text" id="registerName" placeholder="First Name">
    <input type="email" id="registerEmail" placeholder="Email">
    <input type="password" id="registerPassword" placeholder="Password">
    <input type="password" id="confirmPassword" placeholder="Confirm Password">
    <button onclick="register()">Register</button>
  </div>

  <!-- ✅ สำคัญมาก -->
  <div id="result"></div>

  <br>
  <a href="#" onclick="showRegister()">Register</a> |
  <a href="#" onclick="showLogin()">Login</a>

</div>

<script>

// 🔒 ถ้ามี token แล้ว → ไปหน้า index
const token = localStorage.getItem('token');
if (token) {
  window.location.href = "/index.html";
}

// toggle
function showLogin() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('registerForm').style.display = 'none';
}

function showRegister() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
}

// ✅ LOGIN (แก้แล้ว)
function login() {
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  const result = document.getElementById('result');

  fetch('/api/login', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ email, password })
  })
  .then(res => res.json())
  .then(data => {
    console.log("LOGIN RESPONSE:", data);

    if (data.token) {
      localStorage.setItem('token', data.token);

      result.style.color = "green";
      result.innerText = "Login success!";

      // 🔥 redirect ทันที
      window.location.href = "/index.html";

    } else {
      result.style.color = "red";
      result.innerText = data.message || "Login failed";
    }
  })
  .catch(() => {
    result.innerText = "Server error";
  });
}

// REGISTER
function register() {
  const firstName = document.getElementById('registerName').value;
  const email = document.getElementById('registerEmail').value;
  const password = document.getElementById('registerPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const result = document.getElementById('result');

  if (password !== confirm) {
    result.innerText = "Passwords do not match";
    return;
  }

  fetch('/api/register', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ firstName, email, password })
  })
  .then(res => res.json())
  .then(data => {
    if (data.message === "User created") {
      result.style.color = "green";
      result.innerText = "Register success! Please login.";

      showLogin();
    } else {
      result.innerText = data.message;
    }
  });
}

</script>

</body>
</html>
